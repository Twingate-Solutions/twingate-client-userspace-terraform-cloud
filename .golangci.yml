version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - os.Unsetenv
  exclusions:
    rules:
      - path: (_test\.go|internal/testutil/)
        linters: [errcheck]
